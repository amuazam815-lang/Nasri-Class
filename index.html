<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6257e8">
<meta name="description" content="Nasri Class - Learn, Quiz and Grow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Nasri Class</title>
</head>

<body>

<div id="app">

<header class="top">
  <div>
    <span>Welcome back 👋</span>
    <h1>Nasri Class</h1>
  </div>
  <img class="avatar" src="icon-192.png">
</header>

<section class="goal">
  <div>
    <span>Today's Goal</span>
    <strong>75%</strong>
    <small>Keep learning!</small>
  </div>
  <div class="ring">75%</div>
</section>

<section class="streak">
  <div>
    <b>🔥 7 Day Streak</b>
    <span>Great job! Keep it going.</span>
  </div>
  <span class="star">⭐</span>
</section>

<div class="section-title">
  <h2>Subjects</h2>
  <button onclick="showAll()">View All</button>
</div>

<section id="subjects" class="grid"></section>

<h2 class="quick-title">Quick Learning</h2>

<section class="quick grid"></section>

</div>

<nav class="nav">

<button onclick="home()">
🏠
<span>Home</span>
</button>

<button onclick="showAll()">
📚
<span>Subjects</span>
</button>

<button onclick="quiz()">
📝
<span>Quiz</span>
</button>

<button onclick="progress()">
📊
<span>Progress</span>
</button>

</nav>

<script src="script.js"></script>

</body>
</html>
